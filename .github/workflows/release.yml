name: Release

on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    name: Tag & Release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch tags
        run: git fetch --tags --force --prune

      - name: Determine next version (YY.M.VERSION)
        id: tag
        run: |
          YEAR=$(date -u +%y)
          MONTH=$(date -u +%-m)

          LATEST=$(git tag -l "${YEAR}.${MONTH}.*" | sort -t. -k3 -n | tail -1)

          if [ -z "$LATEST" ]; then
            VERSION=1
          else
            VERSION=$(echo "$LATEST" | cut -d. -f3)
            VERSION=$((VERSION + 1))
          fi

          NEW_TAG="${YEAR}.${MONTH}.${VERSION}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Computed version: $NEW_TAG (latest existing: ${LATEST:-none})"

      - name: Bump version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          npm version "${{ steps.tag.outputs.new_tag }}" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json 2>/dev/null || git add package.json
          git commit -m "chore: bump version to ${{ steps.tag.outputs.new_tag }}" || echo "No changes to commit"
          git tag "${{ steps.tag.outputs.new_tag }}"
          git push origin --tags
          git push origin main 2>/dev/null || echo "::warning::Could not push version bump (branch protection). Tag created successfully."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.tag.outputs.new_tag }}" --title "v${{ steps.tag.outputs.new_tag }}" --generate-notes
